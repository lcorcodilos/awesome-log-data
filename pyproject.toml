[project]
name = "awesome-log-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas Corcodilos", email = "corcodilos.lucas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "evtx>=0.12.1",
    "pydantic>=2.13.4",
    "pygrok>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pygrok.*"]
ignore_missing_imports = true
